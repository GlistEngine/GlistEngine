
plugins {
    id 'com.android.application'
}
def findGlistPluginsPath() {
    def currentDir = project.projectDir
    for (int i = 0; i < 5; i++) {
        def testDir = new File(currentDir, "glistplugins")
        if (testDir.exists() && testDir.isDirectory()) {
            return testDir.absolutePath
        }
        testDir = new File(currentDir, "../glistplugins")
        if (testDir.exists() && testDir.isDirectory()) {
            return testDir.getCanonicalFile().absolutePath
        }
        currentDir = currentDir.parentFile
        if (currentDir == null) break
    }
    return file('../../../glistplugins').absolutePath
}

def resolveGlistAppDir(String relPath) {
    def dir = project.rootProject.file(relPath)
    if (dir.exists() && dir.isDirectory()) {
        return dir
    }
    dir = project.file("cpp/" + relPath)
    if (dir.exists() && dir.isDirectory()) {
        return dir
    }
    return project.rootProject.file(relPath)
}

def glistAppRelPath = project.hasProperty("glistAppRelPath") ? project.glistAppRelPath:"src/GlistApp"
def glistAppDir = resolveGlistAppDir(glistAppRelPath)
def glistPluginsPath = findGlistPluginsPath()

android {
    namespace 'dev.glist.glistapp'
    compileSdk 35

    sourceSets {
        main {
            java.srcDirs = ['java', "${glistPluginsPath}/gipAndroid/java"]
            assets.srcDirs =  ["${glistAppDir.absolutePath}/assets"]
            res.srcDirs = ['res']
            manifest.srcFile 'AndroidManifest.xml'
        }
    }
    defaultConfig {
        applicationId "dev.glist.glistapp"
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "1.0"
        resValue "string", "app_name", rootProject.name
        buildConfigField "String", "LIBRARY_NAME", "\"${rootProject.name}\""

        ndk {
            abiFilters "arm64-v8a", "x86_64"
        }

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        externalNativeBuild {
            cmake {
                cppFlags '-std=c++14'
                arguments "-DGLIST_APP_REL_PATH=${glistAppDir.absolutePath.replace('\\', '/')}", "-DAPP_NAME=${rootProject.name}"
            }
        }
  
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            //signingConfig signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    externalNativeBuild {
        cmake {
            path file('cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }
    buildFeatures {
        viewBinding true
        resValues true
        buildConfig true
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.4.1'
    implementation 'com.google.android.material:material:1.5.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.3'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.3'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.4.0'
}